<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🍾 Colección de Miniaturas — Wlas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#1a140f; --panel:#241b14; --card:#2b2018; --wood:#5a3a20;
    --text:#f1e6d8; --muted:#b8a894; --accent:#c98a3f;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
  body{ height:100%; margin:0; background:var(--bg); color:var(--text); font-family:Georgia, 'Times New Roman', serif; }
  header{ padding:28px 20px 14px; text-align:center; border-bottom:2px solid var(--wood); }
  header h1{margin:0 0 4px; font-size:1.6rem; letter-spacing:.5px;}
  .searchbar{ max-width:520px; margin:18px auto; padding:0 16px; }
  .searchbar input{
    width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--wood);
    background:var(--panel); color:var(--text); font-size:1rem; font-family:inherit;
  }
  .count{ text-align:center; color:var(--muted); font-size:.85rem; margin-bottom:10px;}
  .grid{
    display:grid; gap:14px; padding:10px 16px 40px;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    max-width:1100px; margin:0 auto;
  }
  .card{ background:var(--card); border:1px solid var(--wood); border-radius:10px; padding:12px 10px; text-align:center; }
  .cat{ color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .swatch{
    width:100%; height:170px; margin:0 auto 8px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    font-weight:bold; font-size:1.3rem; color:#1a140f;
  }
  .foto{ width:100%; height:170px; object-fit:contain; background:var(--panel); border-radius:6px; margin-bottom:8px; }
  .card h3{margin:2px 0 0; font-size:.95rem; line-height:1.2;}
  .variedad{margin:2px 0 0; font-size:.85rem; font-weight:bold; color:var(--text); line-height:1.2;}
  .origen{display:block; margin-top:4px; color:var(--muted); font-size:.78rem;}
  .empty{ text-align:center; color:var(--muted); padding:40px 20px; display:none; }
  footer{ text-align:center; color:var(--muted); font-size:.75rem; padding:20px; }
</style>
</head>
<body>

<header>
  <h1>🍾 Colección de Miniaturas</h1>
</header>

<div class="searchbar">
  <input id="q" type="text" placeholder="Buscar por marca o tipo (ej: ron, Jägermeister)...">
</div>
<div class="count" id="count">Cargando...</div>

<div class="grid" id="grid"></div>
<p class="empty" id="empty">No se encontró ninguna botella con ese nombre.</p>

<footer>Catálogo creado y actualizado por WLAS</footer>

<script>
// Link CSV publicado desde tu Google Sheet (Archivo > Compartir > Publicar en la web > CSV)
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR6mnWTo_qLpduw1jQ5T4bi7DUrYBtviy2Dbrg-MFxeyOLjmAwsIlTjaRF6xfuZg1eTnX4EVmLfQBKQ/pub?gid=0&single=true&output=csv";

let bottles = [];

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const count = document.getElementById('count');
const input = document.getElementById('q');

// color determinístico a partir del nombre, para el respaldo si aún no hay foto subida
function colorFromText(str){
  let hash = 0;
  for (let i=0; i<str.length; i++){ hash = str.charCodeAt(i) + ((hash << 5) - hash); }
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 45%, 55%)`;
}

function normalizeKey(k){
  return k.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]/g,'');
}

function buildBottle(obj){
  const foto = (obj['foto'] || '').toString().trim();
  return {
    category: (obj['categoria'] || '').trim(),
    marca: (obj['marca'] || '').trim(),
    variedad: (obj['nombrevariedad'] || obj['variedad'] || '').trim(),
    origen: (obj['origen'] || '').trim(),
    img: foto ? `img/${foto}.jpg` : ''
  };
}

function render(list){
  grid.innerHTML = "";
  list.forEach(b=>{
    const card = document.createElement('div');
    card.className='card';
    const initial = (b.marca || '?').charAt(0).toUpperCase();
    const color = colorFromText(b.marca || 'x');
    const visual = b.img
      ? `<img class="foto" src="${b.img}" alt="${b.marca}" onerror="this.outerHTML='<div class=\\'swatch\\' style=\\'background:${color}\\'>${initial}</div>'">`
      : `<div class="swatch" style="background:${color}">${initial}</div>`;
    card.innerHTML = `
      <div class="cat">${b.category}</div>
      ${visual}
      <h3>${b.marca}</h3>
      ${b.variedad ? `<p class="variedad">${b.variedad}</p>` : ''}
      ${b.origen ? `<span class="origen">${b.origen}</span>` : ''}
    `;
    grid.appendChild(card);
  });
  empty.style.display = list.length ? 'none' : 'block';
  count.textContent = list.length + (list.length===1 ? ' botella' : ' botellas');
}

input.addEventListener('input', ()=>{
  const q = input.value.trim().toLowerCase();
  const filtered = bottles.filter(b =>
    (b.marca||'').toLowerCase().includes(q) ||
    (b.category||'').toLowerCase().includes(q) ||
    (b.variedad||'').toLowerCase().includes(q) ||
    (b.origen||'').toLowerCase().includes(q)
  );
  render(filtered);
});

async function loadData(){
  try {
    const res = await fetch(CSV_URL);
    const buf = await res.arrayBuffer();
    const text = new TextDecoder('utf-8').decode(buf);
    const parsed = Papa.parse(text.trim(), { skipEmptyLines:true });
    const rows = parsed.data;

    const headerIndex = rows.findIndex(r =>
      r.some(cell => normalizeKey((cell||'').toString()) === 'marca')
    );
    if (headerIndex === -1) throw new Error('sin encabezados reconocibles');

    const headers = rows[headerIndex].map(h => normalizeKey((h||'').toString()));
    const dataRows = rows.slice(headerIndex + 1);

    bottles = dataRows.map(r => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = (r[i] || '').toString().trim(); });
      return buildBottle(obj);
    }).filter(b => b.marca);

    if (bottles.length === 0){
      count.textContent = '';
      grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);">El CSV cargó pero no se reconoció ninguna fila con Marca.</p>';
      empty.style.display = 'none';
    } else {
      render(bottles);
    }
  } catch (e){
    count.textContent = '';
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);">No se pudo cargar la lista desde el Sheet. Si estás viendo esto en la vista previa de Claude, esto es esperado: va a funcionar una vez que subas el archivo a GitHub Pages.</p>';
  }
}

loadData();
</script>
</body>
</html>
